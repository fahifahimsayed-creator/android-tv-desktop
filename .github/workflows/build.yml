name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File publish.ps1 -SkipBuild

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTVDesktop
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          gh release upload $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --clobber
